<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admin — Employability Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Export engines: real PDF (jsPDF + autotable) and real Excel (SheetJS) generation for Export/Reports modules -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   0. DESIGN TOKENS — carried over verbatim from home.html so the
   College Admin experience reads as the same product: Ink/Paper/
   Orange(Blue)/Amber(Violet)/Teal(Cyan) palette, Space Grotesk
   display + Inter body + JetBrains Mono utility.
============================================================ */
:root{
  --ink:            #1B140C;
  --ink-soft:       #241B10;
  --ink-line:       rgba(255,255,255,0.10);
  --blue:           #E8720C;
  --blue-deep:      #B95700;
  --violet:         #F2A93B;
  --cyan:           #1F9E93;
  --paper:          #FBF8F3;
  --paper-alt:      #F5EEE2;
  --paper-raised:   #FFFFFF;
  --white:          #FFFFFF;
  --slate-900:      #1E1A14;
  --slate-700:      #564B3D;
  --slate-500:      #857A69;
  --slate-300:      #DCD2C0;
  --line:           #EAE1D0;
  --ready:          #1F9E73;
  --warn:           #F0B429;
  --risk:           #E8563F;

  --text:var(--slate-900); --text-soft:var(--slate-700); --text-faint:var(--slate-500);

  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body:    'Inter', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;

  --s-1: 8px;  --s-2: 16px; --s-3: 24px; --s-4: 32px;
  --s-5: 40px; --s-6: 48px; --s-7: 64px;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 100px;
  --ease: cubic-bezier(.16,.84,.44,1);
  --ease-soft: cubic-bezier(.22,.68,.32,1.05);
  --transition: .3s var(--ease-soft);

  --shadow-sm: 0 4px 14px -8px rgba(30,26,20,0.18);
  --shadow-md: 0 24px 44px -22px rgba(30,26,20,0.25);
  --shadow-lg: 0 40px 80px -32px rgba(27,20,12,0.35);

  --sidebar-w: 272px; --sidebar-w-c: 84px; --topbar-h: 74px;
}
[data-theme="dark"]{
  --ink:#F5EEE2; --ink-soft:#DCD2C0;
  --paper:#17120C; --paper-raised:#221B12; --paper-alt:#1E1810;
  --line:#3A2F20;
  --text:#F5EEE2; --text-soft:#C9BCA6; --text-faint:#8C8070;
  --shadow-sm: 0 4px 14px -8px rgba(0,0,0,0.5);
  --shadow-md: 0 24px 44px -22px rgba(0,0,0,0.55);
  --shadow-lg: 0 40px 80px -32px rgba(0,0,0,0.65);
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}
body{
  font-family:var(--font-body); background:var(--paper); color:var(--text);
  line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  transition:background var(--transition), color var(--transition);
}
img,svg{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
button,input,select,textarea{ font-family:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; line-height:1.18; letter-spacing:-0.01em; }
::selection{ background:var(--violet); color:var(--ink); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px;
}
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

.eyebrow{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--blue); display:inline-flex; align-items:center; gap:8px; font-weight:600; }
.eyebrow .ring-dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 0 3px rgba(31,158,147,0.18); animation:pulseDot 2.4s ease-in-out infinite; flex:none; }
@keyframes pulseDot{ 0%,100%{ box-shadow:0 0 0 3px rgba(31,158,147,0.18);} 50%{ box-shadow:0 0 0 6px rgba(31,158,147,0.08);} }

/* buttons -------------------------------------------------- */
.btn{ font-weight:600; font-size:14px; padding:11px 20px; border-radius:var(--radius-pill); display:inline-flex; align-items:center; gap:7px; transition:transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition); white-space:nowrap; }
.btn-primary{ background:linear-gradient(115deg, var(--blue) 0%, var(--violet) 50%, var(--blue) 100%); background-size:220% 100%; color:#fff; box-shadow:0 8px 24px -8px rgba(232,114,12,0.5); }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 14px 30px -8px rgba(232,114,12,0.6); background-position:100% 0%; }
.btn-ghost{ color:var(--text); border:1px solid var(--line); background:var(--paper-raised); }
.btn-ghost:hover{ border-color:var(--slate-500); transform:translateY(-1px); }
.btn-accent{ background:var(--violet); color:#3A2500; box-shadow:var(--shadow-sm); }
.btn-accent:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.btn-danger{ background:var(--risk); color:#fff; }
.btn-danger:hover{ background:#C7452F; transform:translateY(-2px); }
.btn-teal{ background:var(--cyan); color:#fff; }
.btn-teal:hover{ background:#186F66; transform:translateY(-2px); }
.btn-sm{ padding:8px 15px; font-size:12.5px; }
.btn-xs{ padding:5px 10px; font-size:11.5px; border-radius:8px; }
.btn-icon{ width:38px; height:38px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--line); background:var(--paper-raised); transition:all var(--transition); }
.btn-icon:hover{ border-color:var(--slate-500); transform:translateY(-1px); }
.btn-icon.active{ background:var(--blue); border-color:var(--blue); color:#fff; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.btn-block{ width:100%; justify-content:center; }
.icon{ width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-sm{ width:14px; height:14px; }
.icon-lg{ width:22px; height:22px; }

/* ============================================================
   1. APP SHELL
============================================================ */
.admin-shell{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--ink); color:#FBF3E7;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:200;
  transition:width var(--transition), transform var(--transition); overflow:hidden;
}
.sidebar.collapsed{ width:var(--sidebar-w-c); }
.sidebar-brand{ display:flex; align-items:center; gap:11px; padding:22px 20px; border-bottom:1px solid var(--ink-line); min-height:var(--topbar-h); }
.brand-mark{ width:38px; height:38px; border-radius:12px; flex:none; background:linear-gradient(135deg,var(--blue),var(--violet)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:14px; color:#fff; }
.brand-text{ font-family:var(--font-display); font-weight:600; font-size:14.5px; line-height:1.25; white-space:nowrap; transition:opacity var(--transition), width var(--transition); }
.brand-text small{ display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--violet); font-weight:600; margin-top:2px; }
.sidebar.collapsed .brand-text{ opacity:0; width:0; }
.sidebar-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 12px 20px; }
.side-section-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:rgba(251,243,231,0.38); padding:16px 12px 8px; white-space:nowrap; transition:all var(--transition); }
.side-section-label:first-child{ padding-top:6px; }
.sidebar.collapsed .side-section-label{ opacity:0; height:0; padding:8px 0 0; overflow:hidden; }
.side-nav{ display:flex; flex-direction:column; gap:2px; }
.side-link{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; color:rgba(251,243,231,0.68); font-size:13.5px; font-weight:600; white-space:nowrap; transition:all var(--transition); position:relative; }
.side-link .icon{ flex:none; }
.side-link:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.side-link.active{ background:linear-gradient(115deg, rgba(232,114,12,0.9), rgba(242,169,59,0.85)); color:#fff; box-shadow:0 8px 20px -8px rgba(232,114,12,0.6); }
.side-link .label{ flex:1; overflow:hidden; text-overflow:ellipsis; }
.side-link .count{ background:rgba(255,255,255,0.16); font-family:var(--font-mono); font-size:10.5px; padding:2px 7px; border-radius:100px; }
.side-link.active .count{ background:rgba(255,255,255,0.28); }
.sidebar.collapsed .side-link .label, .sidebar.collapsed .side-link .count{ display:none; }
.sidebar.collapsed .side-link{ justify-content:center; }
.sidebar-foot{ padding:14px; border-top:1px solid var(--ink-line); }
.sidebar-collapse-btn{ width:100%; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; color:rgba(251,243,231,0.55); font-size:12.5px; font-weight:600; }
.sidebar-collapse-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.sidebar.collapsed .sidebar-collapse-btn .label{ display:none; }
.sidebar.collapsed .sidebar-collapse-btn{ justify-content:center; }
.sidebar.collapsed .sidebar-collapse-btn .icon{ transform:rotate(180deg); }

.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
.sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(18,14,9,0.5); z-index:190; opacity:0; transition:opacity var(--transition); }
.sidebar-backdrop.show{ display:block; opacity:1; }
html.no-scroll, html.no-scroll body{ overflow:hidden; height:100%; }

.topbar{ position:sticky; top:0; z-index:150; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 28px; background:rgba(251,248,243,0.82); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border-bottom:1px solid var(--line); }
[data-theme="dark"] .topbar{ background:rgba(23,18,12,0.82); }
.topbar-left{ display:flex; align-items:center; gap:16px; min-width:0; }
.mobile-menu-btn{ display:none; }
.page-title-wrap{ min-width:0; }
.breadcrumb{ font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-bottom:2px; }
.page-title-wrap h1{ font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar-right{ display:flex; align-items:center; gap:10px; flex:none; }
.search-box{ display:flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-pill); padding:9px 16px; width:280px; transition:border-color var(--transition); }
.search-box:focus-within{ border-color:var(--blue); }
.search-box input{ border:none; outline:none; background:none; font-size:13.5px; width:100%; }
.search-box .icon{ color:var(--text-faint); }
.bell-wrap{ position:relative; }
.bell-dot{ position:absolute; top:8px; right:9px; width:8px; height:8px; border-radius:50%; background:var(--risk); border:2px solid var(--paper-raised); }
.profile-chip{ display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--paper-raised); cursor:pointer; }
.profile-chip .who{ line-height:1.2; }
.profile-chip .who b{ display:block; font-size:12.5px; }
.profile-chip .who span{ font-size:11px; color:var(--text-faint); }
.avatar{ border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-family:var(--font-display); flex:none; }

.main-content{ padding:28px; max-width:1520px; }
.page{ display:flex; flex-direction:column; gap:22px; animation:pageIn .4s var(--ease-soft); }
@keyframes pageIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }

/* section headers ------------------------------------------ */
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.section-head h2{ font-size:21px; }
.section-head p{ color:var(--text-soft); font-size:13.5px; margin-top:4px; }
.head-actions{ display:flex; gap:10px; flex-wrap:wrap; }

/* back link -------------------------------------------------*/
.back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text-soft); }
.back-link:hover{ color:var(--blue); }

/* cards ------------------------------------------------------*/
.card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:22px; }
.grid{ display:grid; gap:18px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-12{ grid-template-columns:repeat(12,1fr); }
.span-4{ grid-column:span 4; } .span-6{ grid-column:span 6; } .span-8{ grid-column:span 8; } .span-12{ grid-column:span 12; } .span-3{grid-column:span 3;} .span-5{grid-column:span 5;} .span-7{grid-column:span 7;} .span-9{grid-column:span 9;}

/* kpi cards ---------------------------------------------------*/
.kpi-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; transition:transform var(--transition), box-shadow var(--transition); position:relative; overflow:hidden; }
.kpi-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.kpi-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
.kpi-trend{ font-family:var(--font-mono); font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:3px; padding:3px 8px; border-radius:100px; }
.kpi-trend.up{ color:var(--ready); background:rgba(31,158,115,0.12); }
.kpi-trend.down{ color:var(--risk); background:rgba(232,86,63,0.12); }
.kpi-value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-bottom:2px; }
.kpi-label{ font-size:12.5px; color:var(--text-soft); margin-bottom:12px; }
.kpi-spark{ width:100%; height:34px; }

/* chips / badges ---------------------------------------------*/
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:100px; font-family:var(--font-mono); letter-spacing:.02em; white-space:nowrap; }
.chip-ready{ background:rgba(31,158,115,0.13); color:var(--ready); }
.chip-warn{ background:rgba(240,180,41,0.16); color:#96700E; }
.chip-risk{ background:rgba(232,86,63,0.13); color:var(--risk); }
.chip-neutral{ background:var(--paper-alt); color:var(--text-soft); }
.chip-info{ background:rgba(31,158,147,0.13); color:var(--cyan); }

/* tables -------------------------------------------------------*/
.table-wrap{ overflow-x:auto; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--paper-raised); }
table.dt{ width:100%; border-collapse:collapse; min-width:760px; }
table.dt thead th{ text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); padding:13px 16px; border-bottom:1px solid var(--line); background:var(--paper-alt); white-space:nowrap; }
table.dt tbody td{ padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
table.dt tbody tr:last-child td{ border-bottom:none; }
table.dt tbody tr{ transition:background var(--transition); }
table.dt tbody tr:hover{ background:var(--paper-alt); }
.row-clickable{ cursor:pointer; }
.cell-name{ font-weight:600; }
.cell-sub{ font-size:11.5px; color:var(--text-faint); }
.row-actions{ display:flex; gap:6px; }

/* toolbar / filters ----------------------------------------------*/
.toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between; }
.toolbar-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1; }
.filter-select, .filter-input{ border:1px solid var(--line); background:var(--paper-raised); border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--text); }
.filter-input{ min-width:220px; }
.tag-filter{ display:flex; gap:8px; flex-wrap:wrap; }
.pagination{ display:flex; align-items:center; gap:6px; justify-content:flex-end; padding:14px 16px; font-size:12.5px; color:var(--text-soft); }
.page-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12px; }
.page-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* tabs --------------------------------------------------------*/
.tabbar{ display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0; }
.tab-btn{ padding:11px 16px; font-size:13px; font-weight:600; color:var(--text-soft); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.tab-btn:hover{ color:var(--text); }
.tab-btn.active{ color:var(--blue); border-color:var(--blue); }
.tab-btn .count{ background:var(--paper-alt); font-family:var(--font-mono); font-size:10px; padding:1px 6px; border-radius:100px; }
.tab-btn.active .count{ background:rgba(232,114,12,0.14); color:var(--blue); }

/* pills subnav (module sub-sections) */
.subnav{ display:flex; gap:8px; flex-wrap:wrap; }
.subnav a, .subnav button{ padding:8px 15px; border-radius:100px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--paper-raised); color:var(--text-soft); }
.subnav a.active, .subnav button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* progress bars -------------------------------------------------*/
.pbar{ height:8px; border-radius:100px; background:var(--paper-alt); overflow:hidden; }
.pbar > i{ display:block; height:100%; border-radius:100px; background:linear-gradient(90deg,var(--blue),var(--violet)); }
.pbar.teal > i{ background:var(--cyan); }
.pbar.risk > i{ background:var(--risk); }
.pbar.ready > i{ background:var(--ready); }

/* empty state -----------------------------------------------------*/
.empty-state{ text-align:center; padding:54px 20px; color:var(--text-soft); }
.empty-state .icon-lg{ margin:0 auto 14px; width:40px; height:40px; color:var(--text-faint); }
.empty-state h3{ font-size:16px; margin-bottom:6px; color:var(--text); }
.empty-state p{ font-size:13px; max-width:360px; margin:0 auto; }

/* skeleton --------------------------------------------------------*/
.skel{ background:linear-gradient(90deg, var(--paper-alt) 25%, var(--line) 37%, var(--paper-alt) 63%); background-size:400% 100%; animation:skelShine 1.4s ease infinite; border-radius:8px; }
@keyframes skelShine{ 0%{ background-position:100% 0;} 100%{ background-position:0 0;} }

/* form elements -----------------------------------------------------*/
.form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field.full{ grid-column:1/-1; }
.field label{ font-size:12.5px; font-weight:600; color:var(--text-soft); }
.field label .req{ color:var(--risk); }
.field input, .field select, .field textarea{ border:1px solid var(--line); background:var(--paper-raised); border-radius:10px; padding:11px 13px; font-size:13.5px; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--blue); }
.field .hint{ font-size:11.5px; color:var(--text-faint); }
.field-error input{ border-color:var(--risk); }
.field-error .err-msg{ color:var(--risk); font-size:11.5px; }
.checkline{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
.upload-zone{ border:2px dashed var(--line); border-radius:var(--radius-md); padding:36px 20px; text-align:center; color:var(--text-soft); background:var(--paper-alt); }
.upload-zone .icon-lg{ margin:0 auto 10px; color:var(--blue); }
.stepper{ display:flex; align-items:center; gap:8px; }
.step{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--text-faint); }
.step .num{ width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11.5px; }
.step.active{ color:var(--blue); }
.step.active .num{ border-color:var(--blue); background:var(--blue); color:#fff; }
.step.done .num{ border-color:var(--ready); background:var(--ready); color:#fff; }
.step-line{ width:28px; height:2px; background:var(--line); }

/* modal -------------------------------------------------------------*/
.modal-overlay{ position:fixed; inset:0; background:rgba(27,20,12,0.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:900; padding:20px; animation:fadeIn .25s var(--ease); }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{ background:var(--paper-raised); border-radius:var(--radius-lg); max-width:640px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:modalIn .35s var(--ease-soft); }
.modal.modal-lg{ max-width:920px; }
@keyframes modalIn{ from{ opacity:0; transform:translateY(18px) scale(.97);} to{ opacity:1; transform:none;} }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper-raised); z-index:2; }
.modal-head h3{ font-size:17.5px; }
.modal-head p{ font-size:12.5px; color:var(--text-soft); margin-top:3px; }
.modal-body{ padding:24px; display:flex; flex-direction:column; gap:18px; }
.modal-foot{ padding:18px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--paper-raised); }

/* toast ---------------------------------------------------------------*/
.toast-container{ position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px; }
.toast{ background:var(--ink); color:#fff; padding:13px 18px; border-radius:12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); animation:toastIn .35s var(--ease-soft); max-width:340px; }
.toast.success .icon{ color:var(--ready); } .toast.error .icon{ color:var(--risk); } .toast.info .icon{ color:var(--violet); }
@keyframes toastIn{ from{ opacity:0; transform:translateX(30px);} to{ opacity:1; transform:none;} }

/* misc entity cards ------------------------------------------------------*/
.entity-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; transition:transform var(--transition), box-shadow var(--transition); cursor:pointer; display:flex; flex-direction:column; gap:12px; }
.entity-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); }
.rank-badge{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; font-weight:700; background:var(--paper-alt); color:var(--text-soft); }

/* notif list -----------------------------------------------------------*/
.notif-item{ display:flex; gap:12px; padding:14px 16px; border-radius:12px; transition:background var(--transition); align-items:flex-start; }
.notif-item:hover{ background:var(--paper-alt); }
.notif-item.unread{ background:rgba(232,114,12,0.05); }
.notif-ic{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
.notif-item.unread .notif-ic{ background:rgba(232,114,12,0.12); color:var(--blue); }
.notif-item:not(.unread) .notif-ic{ background:var(--paper-alt); color:var(--text-faint); }

/* audit timeline ----------------------------------------------------------*/
.timeline{ position:relative; padding-left:26px; }
.timeline::before{ content:''; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line); }
.tl-item{ position:relative; padding-bottom:22px; }
.tl-item:last-child{ padding-bottom:0; }
.tl-dot{ position:absolute; left:-26px; top:3px; width:16px; height:16px; border-radius:50%; background:var(--paper-raised); border:2px solid var(--blue); }
.tl-time{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }

/* rule card ----------------------------------------------------------------*/
.rule-card{ display:flex; align-items:center; gap:14px; padding:16px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--paper-alt); }
.rule-ic{ width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }

/* dashboard hero + kpi strip -------------------------------------------*/
.dash-hero{ position:relative; overflow:hidden; border-radius:var(--radius-lg); background:linear-gradient(120deg, var(--ink) 0%, #3A2410 55%, var(--blue-deep) 130%); color:#FBF3E7; padding:34px 38px; display:flex; align-items:center; gap:28px; justify-content:space-between; }
.dash-hero-left{ position:relative; z-index:2; max-width:520px; }
.dash-hero-left .eyebrow{ color:var(--violet); }
.dash-hero-left h1{ font-size:28px; color:#fff; margin:10px 0 8px; }
.dash-hero-left p{ font-size:14px; color:rgba(251,243,231,0.78); line-height:1.6; margin-bottom:20px; }
.dash-hero-cta{ display:flex; gap:10px; flex-wrap:wrap; }
.dash-hero-cta .btn-ghost{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.25); color:#fff; }
.dash-hero-illustration{ position:relative; z-index:2; flex:none; width:230px; height:150px; }
.dash-hero::before{ content:''; position:absolute; right:-60px; top:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(242,169,59,0.35), transparent 70%); z-index:1; }
.dash-hero::after{ content:''; position:absolute; left:30%; bottom:-100px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(31,158,147,0.25), transparent 70%); z-index:1; }

.kpi-strip{ display:grid; grid-template-columns:repeat(8,1fr); background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
.kpi-strip-item{ padding:18px 16px; border-right:1px solid var(--line); transition:background var(--transition); }
.kpi-strip-item:last-child{ border-right:none; }
.kpi-strip-item:hover{ background:var(--paper-alt); }
.kpi-strip-ic{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
.kpi-strip-value{ font-family:var(--font-display); font-size:19px; font-weight:700; }
.kpi-strip-label{ font-size:11px; color:var(--text-soft); margin-top:2px; }
.kpi-strip-trend{ font-family:var(--font-mono); font-size:10.5px; font-weight:700; margin-top:6px; display:inline-flex; align-items:center; gap:2px; }
.kpi-strip-trend.up{ color:var(--ready);} .kpi-strip-trend.down{ color:var(--risk); }

.action-item{ display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:12px; border:1px solid var(--line); margin-bottom:8px; }
.action-item.urgent{ border-color:rgba(232,86,63,0.35); background:rgba(232,86,63,0.05); }
.action-item .a-ic{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; background:rgba(240,180,41,0.18); color:#96700E; }
.action-item.urgent .a-ic{ background:rgba(232,86,63,0.16); color:var(--risk); }

th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--text); }
th.sortable .sort-arrow{ display:inline-block; margin-left:3px; opacity:0.5; }
.qa-strip{ display:flex; gap:12px; flex-wrap:wrap; justify-content:space-between; }
.qa-item{ flex:1; min-width:120px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 10px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--paper-raised); text-align:center; transition:all var(--transition); }
.qa-item:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--blue); }
.qa-item .qa-ic{ width:40px; height:40px; border-radius:12px; background:rgba(232,114,12,0.12); color:var(--blue); display:flex; align-items:center; justify-content:center; }
.qa-item span{ font-size:12px; font-weight:600; }
@media (max-width:1180px){ .kpi-strip{ grid-template-columns:repeat(4,1fr); } .dash-hero{ flex-direction:column; text-align:left; } .dash-hero-illustration{ width:100%; height:120px; } }
@media (max-width:640px){ .kpi-strip{ grid-template-columns:repeat(2,1fr); } .kpi-strip-item{ border-bottom:1px solid var(--line); } }

/* responsive ---------------------------------------------------------------*/
@media (max-width: 1180px){
  .grid-4{ grid-template-columns:repeat(2,1fr); }
  .grid-3{ grid-template-columns:repeat(2,1fr); }
  .grid-12 .span-4, .grid-12 .span-3{ grid-column:span 6; }
  .grid-12 .span-8, .grid-12 .span-9{ grid-column:span 12; }
  .form-grid{ grid-template-columns:1fr; }
}
@media (max-width: 1024px){
  .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:var(--shadow-lg); }
  .sidebar.mobile-open{ transform:translateX(0); }
  .sidebar.collapsed{ width:var(--sidebar-w); }
  .sidebar.collapsed .brand-text, .sidebar.collapsed .side-link .label, .sidebar.collapsed .side-link .count, .sidebar.collapsed .side-section-label, .sidebar.collapsed .sidebar-collapse-btn .label{ display:block; opacity:1; height:auto; }
  .sidebar-collapse-btn{ display:none; }
  .mobile-menu-btn{ display:flex; }
  .topbar{ padding:0 16px; }
}
@media (max-width: 767px){
  .search-box{ display:none; }
  .main-content{ padding:18px; }
  .grid-4, .grid-3, .grid-2{ grid-template-columns:1fr; }
  .grid-12 .span-4, .grid-12 .span-6, .grid-12 .span-8, .grid-12 .span-3, .grid-12 .span-5, .grid-12 .span-7, .grid-12 .span-9{ grid-column:span 12; }
  .profile-chip .who{ display:none; }
}
@media (min-width: 768px) and (max-width: 900px){
  .search-box{ width:180px; }
}

function ic(name, cls='icon'){ return `<svg class="${cls}" viewBox="0 0 24 24">${ICONS[name]||''}</svg>`; }

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }

function statusChip(status){
  const map = {
    ready:['chip-ready','Placement Ready'], near:['chip-warn','Near Ready'], risk:['chip-risk','High Risk'], commdef:['chip-info','Communication Deficit'], intdef:['chip-warn','Interview Deficit'],
    active:['chip-ready','Active'], pending:['chip-warn','Pending Approval'], suspended:['chip-risk','Suspended'], inactive:['chip-neutral','Inactive'],
    published:['chip-ready','Published'], draft:['chip-warn','Draft'], archived:['chip-neutral','Archived'],
    live:['chip-ready','Live'], upcoming:['chip-info','Upcoming'], closed:['chip-neutral','Closed'], expired:['chip-risk','Expired'],
    scheduled:['chip-info','Scheduled'], completed:['chip-ready','Completed'], approved:['chip-ready','Approved'], rejected:['chip-risk','Rejected'], underreview:['chip-warn','Under Review'],
    present:['chip-ready','Present'], absent:['chip-risk','Absent'],
  };
  const [cls,label] = map[status] || ['chip-neutral', status];
  return `<span class="chip ${cls}">${label}</span>`;
}
function avatarChip(name, size=32){
  const initials = name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const colors = ['#E8720C','#1F9E93','#F2A93B','#B95700','#146F67','#C94F2E'];
  let hash=0; for(const c of name) hash += c.charCodeAt(0);
  const color = colors[hash % colors.length];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${size*0.38}px;">${initials}</div>`;
}

/* ============================================================
   CHART HELPERS — pure functions returning inline SVG markup
============================================================ */
function polar(cx,cy,r,angleDeg){ const a=(angleDeg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }

function sparklineSVG(values, color, w=110, h=34){
  const max=Math.max(...values), min=Math.min(...values); const range=(max-min)||1;
  const step=w/(values.length-1);
  const pts=values.map((v,i)=>[i*step, h-((v-min)/range)*(h-4)-2]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`0,${h} ${line} ${w},${h}`;
  const id='sp'+Math.random().toString(36).slice(2,9);
  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#${id})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function donutSVG(segments, size=180, thickness=26, centerLabel='', centerSub=''){
  const total=segments.reduce((a,s)=>a+s.value,0)||1;
  const cx=size/2, cy=size/2, r=(size-thickness)/2;
  let angle=0, paths='';
  segments.forEach(seg=>{
    const frac=seg.value/total; const start=angle; const end=angle+frac*360; angle=end;
    const large=(end-start)>180?1:0;
    const [x1,y1]=polar(cx,cy,r,start); const [x2,y2]=polar(cx,cy,r,end-(frac<1?0.8:0));
    paths+=`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-linecap="butt"/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;display:block;margin:0 auto;">${paths}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="var(--text)">${centerLabel||total}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="var(--text-faint)">${centerSub||'STUDENTS'}</text>
  </svg>`;
}

function barChartSVG(items, w=560, h=240, color='var(--blue)'){
  const padL=34, padR=14, padT=14, padB=40;
  const iw=w-padL-padR, ih=h-padT-padB;
  const max=Math.max(...items.map(i=>i.value),1)*1.15;
  const gap=iw/items.length; const bw=gap*0.56;
  let grid='', bars='', labels='';
  [0,25,50,75,100].forEach(v=>{ const y=padT+ih-(v/100)*ih; grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; });
  items.forEach((it,i)=>{
    const x=padL+i*gap+(gap-bw)/2; const bh=(it.value/max)*ih; const y=padT+ih-bh;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="${it.color||color}"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="var(--text)">${it.value}${it.suffix||''}</text>`;
    labels+=`<text x="${x+bw/2}" y="${h-14}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="var(--text-faint)">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${grid}${bars}${labels}</svg>`;
}

function lineChartSVG(series, months, w=560, h=220){
  const padL=30, padR=14, padT=16, padB=28;
  const iw=w-padL-padR, ih=h-padT-padB;
  const stepX=iw/(months.length-1);
  let grid='', axisLabels='';
  [0,25,50,75,100].forEach(v=>{
    const y=padT+ih-(v/100)*ih;
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    axisLabels+=`<text x="4" y="${y+3}" font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--text-faint)">${v}</text>`;
  });
  months.forEach((m,i)=>{ axisLabels+=`<text x="${padL+i*stepX}" y="${h-8}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="var(--text-faint)">${m}</text>`; });
  let lines='';
  series.forEach(s=>{
    const pts=s.values.map((v,i)=> v>0 ? [padL+i*stepX, padT+ih-(v/100)*ih] : null);
    const validPts=pts.filter(Boolean);
    const path=validPts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' ');
    lines+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    lines+=validPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`).join('');
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${grid}${lines}${axisLabels}</svg>`;
}

function radarSVG(axes, size=280){
  const cx=size/2, cy=size/2, r=size/2-42, n=axes.length;
  let grid='';
  [20,40,60,80,100].forEach(pct=>{
    const pts=axes.map((_,i)=>polar(cx,cy,r*pct/100, i*360/n).join(',')).join(' ');
    grid+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  axes.forEach((ax,i)=>{
    const [x,y]=polar(cx,cy,r,i*360/n);
    grid+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
  });
  const dataPts=axes.map((ax,i)=>polar(cx,cy,r*ax.value/100, i*360/n).join(',')).join(' ');
  let labels='';
  axes.forEach((ax,i)=>{
    const [x,y]=polar(cx,cy,r+22, i*360/n);
    labels+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" font-size="11" fill="var(--text-soft)">${ax.label}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size+40}px;display:block;margin:0 auto;">
    ${grid}
    <polygon points="${dataPts}" fill="rgba(232,114,12,0.18)" stroke="var(--blue-deep)" stroke-width="2"/>
    ${axes.map((ax,i)=>{ const [x,y]=polar(cx,cy,r*ax.value/100,i*360/n); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--blue-deep)"/>`; }).join('')}
    ${labels}
  </svg>`;
}

function heatmapSVG(rows, cols, matrix, w=560){
  const cell=Math.min(70,(w-140)/cols.length);
  const h=rows.length*32+40;
  let cells='';
  rows.forEach((r,ri)=>{
    cells+=`<text x="130" y="${40+ri*32+16}" font-family="Inter" font-size="11" fill="var(--text-soft)" text-anchor="end">${r}</text>`;
    cols.forEach((c,ci)=>{
      const v=matrix[ri][ci]; const alpha=0.12+(v/100)*0.75;
      cells+=`<rect x="${140+ci*cell}" y="${40+ri*32}" width="${cell-4}" height="24" rx="6" fill="rgba(232,114,12,${alpha.toFixed(2)})"/>`;
      cells+=`<text x="${140+ci*cell+(cell-4)/2}" y="${40+ri*32+16}" font-family="JetBrains Mono" font-size="10" text-anchor="middle" fill="${v>55?'#fff':'var(--text)'}">${v}</text>`;
    });
  });
  cols.forEach((c,ci)=>{ cells+=`<text x="${140+ci*cell+(cell-4)/2}" y="26" font-family="Inter" font-size="10.5" text-anchor="middle" fill="var(--text-faint)">${c}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${cells}</svg>`;
}

/* ============================================================
   BACKEND-READY SERVICE LAYER
   Every mutation in the UI goes through `api.*` below instead of
   touching the in-memory arrays directly. Right now each call
   resolves against local arrays after a simulated network delay;
   swapping the body of any function for a `fetch('/api/...')` call
   against the FastAPI backend is a drop-in change — nothing in the
   page code needs to change. Endpoint each maps to is noted inline.
============================================================ */
const API_LATENCY = 300;
function apiDelay(v){ return new Promise(res=>setTimeout(()=>res(v), API_LATENCY)); }
let STUDENT_SEQ=STUDENTS.length, DEPT_SEQ=DEPARTMENTS.length, ASSESS_SEQ=ASSESSMENTS.length, SESSION_SEQ=SESSIONS.length, NOTIF_SEQ=NOTIFICATIONS.length;
function nowStamp(){ const d=new Date(); return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
const CURRENT_USER = { name:'Rahul Deshmukh', role:'College Admin' };

const api = {
  audit: {
    log(action){ // POST /api/audit-logs
      AUDIT_LOGS.unshift({ user:CURRENT_USER.name, role:CURRENT_USER.role, time:'Just now · '+nowStamp(), ip:'192.168.4.19', action });
      return apiDelay(true);
    },
    list(){ return apiDelay(AUDIT_LOGS); } // GET /api/audit-logs
  },
  notifications: {
    push(n){ // POST /api/notifications
      NOTIFICATIONS.unshift(Object.assign({ id:'n'+(++NOTIF_SEQ), time:'Just now', unread:true }, n));
      return apiDelay(true);
    },
    list(){ return apiDelay(NOTIFICATIONS); } // GET /api/notifications
  },
  students: {
    create(data){ // POST /api/students
      return apiDelay().then(()=>{
        if(STUDENTS.some(s=>s.reg.toLowerCase()===data.reg.toLowerCase())){ const e=new Error('Register number already exists'); e.code='DUPLICATE_REG'; throw e; }
        const base = { comm:60,tech:60,apt:60,prof:60,interview:60,prog:60,logic:60,verbal:60,quant:60,resume:60,behavior:60,soft:60,ai:60, improvement:0, assessmentStatus:'not-started', trainer:'Unassigned', attendance:0, lastActivity:'Just now', history:[{stage:'Baseline', overall:0}] };
        const s = mkStudent(Object.assign(base, data, { id:'s'+(++STUDENT_SEQ) }));
        s.inactive=false; s.photo=null; s.idx=STUDENTS.length;
        STUDENTS.push(s);
        const dept = DEPARTMENTS.find(d=>d.name===s.dept); if(dept) dept.students++;
        return s;
      });
    },
    update(id, data){ // PATCH /api/students/{id}
      return apiDelay().then(()=>{
        const s = STUDENTS.find(x=>x.id===id); if(!s) throw new Error('NOT_FOUND');
        if(data.reg && data.reg.toLowerCase()!==s.reg.toLowerCase() && STUDENTS.some(x=>x.id!==id && x.reg.toLowerCase()===data.reg.toLowerCase())){ const e=new Error('Register number already exists'); e.code='DUPLICATE_REG'; throw e; }
        Object.assign(s, data);
        return mkStudent(s);
      });
    },
    bulkImport(rows){ // POST /api/students/bulk-import
      return apiDelay().then(()=>{
        let ok=0, failed=0;
        rows.forEach(r=>{
          const name = (r.name||r['Student Name']||r['Full Name']||'').toString().trim();
          const reg = (r.reg||r['Register Number']||r['Register No']||'').toString().trim();
          if(!name || !reg || STUDENTS.some(s=>s.reg.toLowerCase()===reg.toLowerCase())){ failed++; return; }
          const dept = (r.dept||r['Department']||DEPARTMENTS[0].name).toString().trim();
          const s = mkStudent({ id:'s'+(++STUDENT_SEQ), name, reg, dept,
            year:(r.year||r['Year']||'1st Year').toString(), section:(r.section||r['Section']||'A').toString(),
            email:(r.email||r['Email']||'').toString(), phone:(r.phone||r['Phone']||'').toString(),
            cohort:(r.cohort||r['Cohort']||'2026 · Batch A').toString(),
            comm:60,tech:60,apt:60,prof:60,interview:60,prog:60,logic:60,verbal:60,quant:60,resume:60,behavior:60,soft:60,ai:60,
            improvement:0, assessmentStatus:'not-started', trainer:'Unassigned', attendance:0, lastActivity:'Just now',
            history:[{stage:'Baseline', overall:0}] });
          s.inactive=false; s.photo=null; s.idx=STUDENTS.length;
          STUDENTS.push(s);
          const d = DEPARTMENTS.find(x=>x.name===dept); if(d) d.students++;
          ok++;
        });
        return { ok, failed, total: rows.length };
      });
    }
  },
  departments: {
    create(data){ return apiDelay().then(()=>{ const d=Object.assign({ id:'d'+(++DEPT_SEQ), students:0, avgScore:0, placement:0, highRisk:0, intervention:0, rank:DEPARTMENTS.length+1 }, data); DEPARTMENTS.push(d); return d; }); }, // POST /api/departments
    update(id, data){ return apiDelay().then(()=>{ const d=DEPARTMENTS.find(x=>x.id===id); if(d) Object.assign(d,data); return d; }); } // PATCH /api/departments/{id}
  },
  assessments: {
    create(data){ return apiDelay().then(()=>{ const a=Object.assign({ id:'a'+(++ASSESS_SEQ), participants:0, completion:0 }, data); ASSESSMENTS.push(a); return a; }); }, // POST /api/assessments
    update(id, data){ return apiDelay().then(()=>{ const a=ASSESSMENTS.find(x=>x.id===id); if(!a) throw new Error('NOT_FOUND'); Object.assign(a,data); return a; }); } // PATCH /api/assessments/{id}
  },
  interventions: {
    scheduleSession(data){ return apiDelay().then(()=>{ const s=Object.assign({ id:'sc'+(++SESSION_SEQ), status:'scheduled', present:0, absent:0 }, data); SESSIONS.push(s); return s; }); } // POST /api/interventions/sessions
  },
  reports: {
    generate(key){ return apiDelay({ key, generatedAt:nowStamp() }); } // GET /api/reports/{key}
  }
};

function showToast(msg, type='success'){
  const iconMap = {success:'check', error:'x', info:'info'};
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${ic(iconMap[type]||'check')}<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(30px)'; setTimeout(()=>el.remove(),300); }, 3200);
}
function openModal(html, size=''){
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" data-action="close-modal"><div class="modal ${size}" onclick="event.stopPropagation()">${html}</div></div>`;
}

function dashboardStats(){
  const total = STUDENTS.length;
  const ready = STUDENTS.filter(s=>s.status==='ready').length;
  const near = STUDENTS.filter(s=>s.status==='near').length;
  const risk = STUDENTS.filter(s=>s.status==='risk' || s.overall<50).length;
  const avgScore = Math.round(STUDENTS.reduce((a,s)=>a+s.overall,0)/total);
  const completion = Math.round(STUDENTS.filter(s=>s.assessmentStatus==='completed').length/total*100);
  return {total, ready, near, risk, avgScore, completion};
}

function studentSubnav(active){
  const tabs = [ ['list','Student List'], ['add','Add Student'], ['bulk','Bulk Upload'], ['inactive','Inactive Students'], ['analytics','Student Analytics'] ];
  return `<div class="subnav">${tabs.map(([k,l])=>`<button class="${active===k?'active':''}" data-action="set-tab" data-group="students" data-value="${k}">${l}</button>`).join('')}</div>`;
}
function filteredStudents(includeInactive){
  const f = STATE.filters.students;
  return STUDENTS.filter(s=>{
    if(!includeInactive && s.inactive) return false;
    if(includeInactive && !s.inactive) return false;
    if(f.dept!=='all' && s.dept!==f.dept) return false;
    if(f.year!=='all' && s.year!==f.year) return false;
    if(f.section!=='all' && s.section!==f.section) return false;
    if(f.status!=='all' && s.status!==f.status) return false;
    if(f.q && !(s.name.toLowerCase().includes(f.q.toLowerCase()) || s.reg.toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  });
}

/* ============================================================
   EXPORT ENGINE — real PDF (jsPDF) + real Excel (SheetJS) files
============================================================ */
function studentRow(s){ return { 'Register Number':s.reg, 'Student Name':s.name, 'Department':s.dept, 'Email':s.email, 'Placement Readiness':(COHORT_RULES.find(r=>r.key===s.status)||{label:s.status}).label, 'Assessment Status':s.assessmentStatus }; }
function downloadExcel(filename, rows, sheetName='Sheet1'){
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}
function downloadPDFTable(filename, title, columns, rows){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: columns.length>5?'landscape':'portrait' });
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Employability Intelligence Platform', 14, 15);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(title, 14, 22);
  doc.setFontSize(9); doc.setTextColor(120);
  doc.text('Generated '+new Date().toLocaleString(), 14, 28);
  doc.autoTable({ startY:33, head:[columns], body:rows, styles:{fontSize:8, cellPadding:3}, headStyles:{ fillColor:[232,114,12] } });
  doc.save(filename);
}
function printTable(title, columns, rows){
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>${esc(title)}</title><style>
    body{font-family:Arial,sans-serif;padding:24px;color:#1E1A14;} h1{font-size:18px;} p{color:#564B3D;font-size:12px;}
    table{width:100%;border-collapse:collapse;margin-top:14px;} th,td{border:1px solid #DCD2C0;padding:6px 8px;font-size:12px;text-align:left;}
    th{background:#F5EEE2;}</style></head><body>
    <h1>${esc(title)}</h1><p>Employability Intelligence Platform · Generated ${esc(new Date().toLocaleString())}</p>
    <table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </body></html>`);
  win.document.close(); win.focus();
  setTimeout(()=>win.print(), 300);
}
function studentExportColumns(){ return ['Register No.','Name','Department','Email','Placement Readiness','Assessment Status']; }
function studentExportRows(list){ return list.map(s=>[s.reg, s.name, s.dept, s.email, (COHORT_RULES.find(r=>r.key===s.status)||{label:s.status}).label, s.assessmentStatus]); }

function buildReportData(key){
  switch(key){
    case 'student': return { title:'Student Report', columns: studentExportColumns(), rows: studentExportRows(STUDENTS), sheetRows: STUDENTS.map(studentRow) };
    case 'department': return { title:'Department Report', columns:['Department','Students','Avg Score %','Placement %','High Risk','Intervention %'], rows: DEPARTMENTS.map(d=>[d.name,d.students,d.avgScore,d.placement,d.highRisk,d.intervention]), sheetRows: DEPARTMENTS.map(d=>({Department:d.name, Students:d.students,'Avg Score %':d.avgScore,'Placement %':d.placement,'High Risk':d.highRisk,'Intervention %':d.intervention})) };
    case 'assessment': return { title:'Assessment Report', columns:['Assessment','Type','Status','Start','End','Participants','Completion %'], rows: ASSESSMENTS.map(a=>[a.name,a.type,a.status,a.start,a.end,a.participants,a.completion]), sheetRows: ASSESSMENTS.map(a=>({Assessment:a.name, Type:a.type, Status:a.status, Start:a.start, End:a.end, Participants:a.participants, 'Completion %':a.completion})) };
    case 'intervention': return { title:'Intervention Report', columns:['Intervention','Category','Effectiveness %','Sessions','Avg Improvement'], rows: INTERVENTIONS.map(i=>[i.name,i.category,i.effectiveness,i.sessions,i.avgImprovement]), sheetRows: INTERVENTIONS.map(i=>({Intervention:i.name, Category:i.category, 'Effectiveness %':i.effectiveness, Sessions:i.sessions, 'Avg Improvement':i.avgImprovement})) };
    case 'placement': return { title:'Placement Readiness Report', columns:['Cohort','Rule','Students'], rows: COHORT_RULES.map(r=>[r.label,r.rule,cohortStudents(r.key).length]), sheetRows: COHORT_RULES.map(r=>({Cohort:r.label, Rule:r.rule, Students:cohortStudents(r.key).length})) };
    case 'college': { const ds = dashboardStats(); const readyPct = Math.round(ds.ready/ds.total*100); return { title:'College Report', columns:['Metric','Value'], rows:[['Total Students',ds.total],['Average Score',ds.avgScore+'%'],['Placement Ready %',readyPct+'%'],['High Risk Students',ds.risk]], sheetRows:[{Metric:'Total Students',Value:ds.total},{Metric:'Average Score',Value:ds.avgScore+'%'},{Metric:'Placement Ready %',Value:readyPct+'%'},{Metric:'High Risk Students',Value:ds.risk}] }; }
    default: return { title:'Report', columns:['Item'], rows:[['No data']], sheetRows:[{Item:'No data'}] };
  }
}
function handleExport(what){
  const stamp = Date.now();
  if(what==='students-excel'){ downloadExcel(`students-export-${stamp}.xlsx`, filteredStudents(false).map(studentRow), 'Students'); return; }
  if(what==='students-pdf'){ downloadPDFTable(`students-export-${stamp}.pdf`, 'Student Report', studentExportColumns(), studentExportRows(filteredStudents(false))); return; }
  if(what==='sample-template'){ downloadExcel('student-upload-template.xlsx', [{'Register Number':'MIT21CS001','Student Name':'Jane Doe','Department':'Computer Science & Engineering','Year':'3rd Year','Section':'A','Email':'jane.doe@college.edu','Phone':'+91 90000 00000','Cohort':'2026 · Batch A'}], 'Template'); return; }
  if(what==='results-excel'){ downloadExcel(`assessment-results-${stamp}.xlsx`, STUDENTS.map(s=>({Student:s.name, Department:s.dept, Section:s.section, Score:s.overall, Status:s.status})), 'Results'); return; }
  if(what==='results-pdf'){ downloadPDFTable(`assessment-results-${stamp}.pdf`, 'Assessment Results', ['Student','Department','Section','Score','Status'], STUDENTS.map(s=>[s.name,s.dept,s.section,s.overall+'%',s.status])); return; }
  if(what==='audit-logs'){ downloadExcel(`audit-logs-${stamp}.xlsx`, AUDIT_LOGS.map(a=>({Timestamp:a.time, User:a.user, Role:a.role, Action:a.action, 'IP Address':a.ip})), 'Audit Logs'); return; }
  if(what==='past-report'){ downloadPDFTable(`report-${stamp}.pdf`, 'Report', ['Item'], [['Archived report — regenerate from Reports tab for latest data']]); return; }
  const m = what.match(/^(.*)-(pdf|excel)$/);
  if(m){
    const [,key,fmt] = m;
    const data = buildReportData(key);
    if(fmt==='pdf') downloadPDFTable(`${key}-report-${stamp}.pdf`, data.title, data.columns, data.rows);
    else downloadExcel(`${key}-report-${stamp}.xlsx`, data.sheetRows, data.title.slice(0,28));
    return;
  }
  showToast('Preparing '+what.replace(/-/g,' ')+'…','info');
}

   BULK UPLOAD — real file parsing (CSV/XLSX) via SheetJS
============================================================ */
let PENDING_UPLOAD_ROWS = [];
function triggerFilePicker(){ document.getElementById('bulkFileInput').click(); }
function handleBulkFile(file){
  if(!file) return;
  showToast('Reading file…','info');
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval:'' });
      if(!rows.length){ showToast('The file has no rows to import','error'); return; }
      PENDING_UPLOAD_ROWS = rows;
      openUploadPreviewModal(rows);
    }catch(err){ showToast('Could not read file — please use the sample template format','error'); }
  };
  reader.readAsArrayBuffer(file);
}

   EVENT DELEGATION
============================================================ */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'nav': {
      const page = el.dataset.page;
      const params = {}; if(id) params.id = id;
      goPage(page, params);
      break;
    }
    case 'toggle-sidebar': document.getElementById('sidebar').classList.toggle('collapsed'); break;
    case 'open-mobile-sidebar': document.getElementById('sidebar').classList.add('mobile-open'); document.getElementById('sidebarBackdrop').classList.add('show'); document.documentElement.classList.add('no-scroll'); break;
    case 'close-mobile-sidebar': document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('sidebarBackdrop').classList.remove('show'); document.documentElement.classList.remove('no-scroll'); break;
    case 'toggle-theme': {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      break;
    }
    case 'toggle-notif-panel': {
      const p = document.getElementById('notifPanel');
      if(p.innerHTML){ p.innerHTML=''; break; }
      p.innerHTML = `<div class="card" style="position:absolute;right:0;top:48px;width:340px;max-height:400px;overflow-y:auto;z-index:300;box-shadow:var(--shadow-lg);padding:10px;">
        ${NOTIFICATIONS.slice(0,6).map(notifItem).join('')}
        <div style="text-align:center;padding:8px;"><button class="btn btn-ghost btn-xs" data-action="nav" data-page="notifications">View all notifications</button></div>
      </div>`;
      break;
    }
    case 'mark-notif-read': {
      const n = NOTIFICATIONS.find(x=>x.id===id); if(n) n.unread=false;
      renderPage(); if(document.getElementById('notifPanel')) document.getElementById('notifPanel').innerHTML='';
      break;
    }
    case 'mark-all-read': NOTIFICATIONS.forEach(n=>n.unread=false); renderPage(); showToast('All notifications marked as read'); break;
    case 'logout': confirmModal({title:'Log Out', body:'Are you sure you want to log out of the College Admin dashboard?', confirmLabel:'Log Out', confirmClass:'btn-danger', onConfirm:()=>{ closeModal(); showToast('Logged out successfully','info'); }}); break;

    case 'set-tab': {
      const group = el.dataset.group, value = el.dataset.value;
      STATE.tab[group] = value;
      renderPage();
      break;
    }
    case 'students-page': STATE.page_num.students = Number(el.dataset.value); renderPage(); break;
    case 'filter-students': {
      const field = el.dataset.field;
      STATE.filters.students[field] = el.value !== undefined ? el.value : el.dataset.value;
      STATE.page_num.students = 1;
      renderPage();
      break;
    }
    case 'filter-trainers': {
      const field = el.dataset.field;
      STATE.filters.trainers[field] = el.value !== undefined ? el.value : el.dataset.value;
      renderPage();
      break;
    }
    case 'student-profile-tab': goPage('student-profile', {id, tab: el.dataset.value}); break;

    case 'quick-add-student': openAddStudentModal(); break;
    case 'quick-upload': openUploadModal(); break;
    case 'quick-schedule': openScheduleSessionModal(); break;
    case 'open-schedule-session': openScheduleSessionModal(); break;
    case 'save-session-draft': closeModal(); showToast('Session saved as draft'); break;
    case 'publish-session': {
      const intervention = document.getElementById('schInterv')?.value;
      const cohort = document.getElementById('schCohort')?.value;
      const trainer = document.getElementById('schTrainer')?.value;
      const dept = document.getElementById('schDept')?.value || 'All Departments';
      const venue = document.getElementById('schVenue')?.value.trim();
      const capacity = Number(document.getElementById('schCapacity')?.value);
      const date = document.getElementById('schDate')?.value;
      const time = document.getElementById('schTime')?.value;
      if(!intervention || !cohort || !trainer || !venue || !capacity || !date || !time){ showToast('Please fill in all required fields','error'); break; }
      api.interventions.scheduleSession({ intervention, cohort, trainer, dept, venue, capacity, enrolled:0, date: new Date(date).toDateString(), time: new Date('1970-01-01T'+time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) }).then(s=>{
        closeModal();
        STATE.tab.interventions = 'scheduled';
        renderPage();
        showToast('Intervention session scheduled successfully');
        api.audit.log(`Scheduled intervention — ${s.intervention} (${s.dept}) with ${s.trainer}`);
        api.notifications.push({ type:'intervention', icon:'calendar', title:'Intervention scheduled', desc:`${s.intervention} with ${s.trainer} on ${s.date} at ${s.venue}.` });
        refreshDashboardLive();
      });
      break;
    }
    case 'view-session': openSessionModal(id); break;
    case 'view-intervention': openInterventionModal(id); break;
    case 'view-department': openDepartmentModal(id); break;
    case 'edit-department': openDepartmentFormModal(id); break;
    case 'create-department': openDepartmentFormModal(null); break;
    case 'save-department': {
      const name = document.getElementById('deptName')?.value.trim();
      const code = document.getElementById('deptCode')?.value.trim();
      const status = document.getElementById('deptStatus')?.value || 'Active';
      const head = document.getElementById('deptHead')?.value.trim();
      const description = document.getElementById('deptDesc')?.value.trim();
      if(!name || !code){ showToast('Please fill in all required fields','error'); break; }
      const existingId = el.dataset.id;
      const payload = { name, code, status, head, description };
      const op = existingId ? api.departments.update(existingId, payload) : api.departments.create(payload);
      op.then(d=>{
        closeModal(); renderPage();
        showToast(`${d.name} ${existingId?'updated':'created'} successfully`);
        api.audit.log(`${existingId?'Edited':'Created'} department — ${d.name}`);
        refreshDashboardLive();
      });
      break;
    }

    case 'save-student': {
      const name = document.getElementById('addName')?.value.trim();
      const reg = document.getElementById('addReg')?.value.trim();
      const dept = document.getElementById('addDept')?.value;
      const email = document.getElementById('addEmail')?.value.trim();
      const year = document.getElementById('addYear')?.value || '1st Year';
      const section = document.getElementById('addSection')?.value || 'A';
      const phone = document.getElementById('addPhone')?.value.trim() || '';
      const cohort = document.getElementById('addCohort')?.value.trim() || '2026 · Batch A';
      if(!name || !reg || !dept || !email){ showToast('Please fill in all required fields','error'); break; }
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if(!emailOk){ showToast('Please enter a valid email address','error'); break; }
      api.students.create({ name, reg, dept, email, year, section, phone, cohort }).then(s=>{
        closeModal();
        STATE.tab.students = 'list';
        renderPage();
        showToast(`${s.name} saved successfully`);
        api.audit.log(`Added student — ${s.name} (${s.reg})`);
        api.notifications.push({ type:'student', icon:'user', title:'Student added', desc:`${s.name} was added to ${s.dept}.` });
        refreshDashboardLive();
      }).catch(err=>{
        showToast(err.code==='DUPLICATE_REG' ? 'A student with this register number already exists' : 'Could not save student — please try again', 'error');
      });
      break;
    }
    case 'preview-student': showToast('Preview generated','info'); break;
    case 'edit-student': openEditStudentModal(id); break;
    case 'confirm-edit-student': {
      const btn = el; const name = document.getElementById('editName')?.value.trim();
      const reg = document.getElementById('editReg')?.value.trim();
      const dept = document.getElementById('editDept')?.value;
      const email = document.getElementById('editEmail')?.value.trim();
      if(!name || !reg || !dept || !email){ showToast('Please fill in all required fields','error'); break; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Please enter a valid email address','error'); break; }
      btn.disabled = true; btn.textContent = 'Saving…';
      api.students.update(id, {
        name, reg, dept, email,
        year: document.getElementById('editYear')?.value,
        section: document.getElementById('editSection')?.value,
        phone: document.getElementById('editPhone')?.value.trim(),
        cohort: document.getElementById('editCohort')?.value.trim(),
      }).then(s=>{
        closeModal(); renderPage();
        showToast(`${s.name} updated successfully`);
        api.audit.log(`Edited student record — ${s.name}`);
        refreshDashboardLive();
      }).catch(err=>{
        btn.disabled = false; btn.innerHTML = `${ic('check','icon-sm')}Save Changes`;
        showToast(err.code==='DUPLICATE_REG' ? 'A student with this register number already exists' : 'Could not save changes — please try again', 'error');
      });
      break;
    }
    case 'deactivate-student': confirmModal({title:'Deactivate Student', body:'This student will move to the Inactive Students list. You can reactivate them at any time.', confirmLabel:'Deactivate', confirmClass:'btn-danger', onConfirm:()=>{ const s=STUDENTS.find(x=>x.id===id); if(s) s.inactive=true; closeModal(); renderPage(); showToast('Student deactivated'); }}); break;
    case 'activate-student': { const s=STUDENTS.find(x=>x.id===id); if(s) s.inactive=false; renderPage(); showToast('Student activated'); break; }
    case 'simulate-upload': triggerFilePicker(); break;

    case 'assessment-action': {
      const op = el.dataset.op; const a = ASSESSMENTS.find(x=>x.id===id);
      if(op==='publish'){ if(a){ a.status='upcoming'; api.audit.log(`Published assessment — ${a.name}`); api.notifications.push({type:'assessment', icon:'book', title:'Assessment published', desc:`${a.name} is now published and scheduled.`}); } showToast('Assessment published successfully'); }
      else if(op==='open'){ if(a) a.status='live'; showToast('Assessment window opened'); if(a) api.audit.log(`Opened assessment window — ${a.name}`); }
      else if(op==='close'){ if(a) a.status='closed'; showToast('Assessment window closed'); if(a){ api.audit.log(`Closed assessment window — ${a.name}`); api.notifications.push({type:'assessment', icon:'check', title:'Assessment completed', desc:`${a.name} window has closed.`}); } }
      else if(op==='duplicate'){ showToast('Assessment duplicated as draft'); }
      else if(op==='edit'){ openEditAssessmentModal(id); }
      else if(op==='view'){ STATE.tab.assessments='results'; }
      renderPage();
      break;
    }
    case 'delete-assessment': confirmModal({title:'Delete Assessment', body:'This will permanently remove the assessment and its configuration. This cannot be undone.', confirmLabel:'Delete', confirmClass:'btn-danger', onConfirm:()=>{ const i=ASSESSMENTS.findIndex(x=>x.id===id); if(i>-1) ASSESSMENTS.splice(i,1); closeModal(); renderPage(); showToast('Assessment deleted'); }}); break;
    case 'preview-assessment': showToast('Preview generated','info'); break;
    case 'confirm-edit-assessment': {
      const name = document.getElementById('editAssessName')?.value.trim();
      const type = document.getElementById('editAssessType')?.value;
      const duration = Number(document.getElementById('editAssessDuration')?.value);
      const depts = document.getElementById('editAssessDepts')?.value.trim();
      if(!name || !duration){ showToast('Please fill in all required fields','error'); break; }
      api.assessments.update(id, { name, type, duration, depts }).then(a=>{
        closeModal(); renderPage();
        showToast(`${a.name} updated successfully`);
        api.audit.log(`Edited assessment — ${a.name}`);
        refreshDashboardLive();
      });
      break;
    }
    case 'save-assessment-draft': case 'publish-assessment': {
      const name = document.getElementById('assessName')?.value.trim();
      const type = document.getElementById('assessType')?.value;
      const duration = Number(document.getElementById('assessDuration')?.value);
      const depts = document.getElementById('assessDepts')?.value;
      const start = document.getElementById('assessStart')?.value;
      const end = document.getElementById('assessEnd')?.value;
      if(!name || !type || !duration || !start || !end){ showToast('Please fill in all required fields','error'); break; }
      if(new Date(end) < new Date(start)){ showToast('End date must be after start date','error'); break; }
      const publishing = action==='publish-assessment';
      api.assessments.create({ name, type, duration, depts, start: new Date(start).toDateString(), end: new Date(end).toDateString(), status: publishing?'upcoming':'draft' }).then(a=>{
        showToast(publishing?'Assessment published successfully':'Assessment saved as draft');
        if(publishing){ api.audit.log(`Created assessment — ${a.name}`); api.notifications.push({ type:'assessment', icon:'book', title:'Assessment created', desc:`${a.name} was published and is scheduled to open ${a.start}.` }); }
        STATE.tab.assessments='all'; renderPage(); refreshDashboardLive();
      });
      break;
    }
    case 'view-bank': case 'edit-bank': showToast('Question bank editor opened','info'); break;

    case 'sort-dash-table': {
      const field = el.dataset.field;
      if(DASH_SORT.field===field) DASH_SORT.dir = DASH_SORT.dir==='asc'?'desc':'asc';
      else { DASH_SORT.field = field; DASH_SORT.dir = 'desc'; }
      renderPage();
      break;
    }
    case 'view-trainer': { const t=TRAINERS.find(x=>x.id===id); if(t) openModal(trainerDetailModal(t), 'modal-lg'); break; }
    case 'toggle-trainer-active': {
      const t = TRAINERS.find(x=>x.id===id); if(!t) break;
      const willActivate = !t.active;
      confirmModal({title: willActivate?'Activate Trainer':'Deactivate Trainer',
        body: willActivate? `<b>${esc(t.name)}</b> will regain access to the platform immediately.` : `<b>${esc(t.name)}</b> will lose access to the platform immediately. Their scheduled sessions remain unaffected.`,
        confirmLabel: willActivate?'Activate':'Deactivate', confirmClass: willActivate?'btn-primary':'btn-danger',
        onConfirm:()=>{ t.active = willActivate; closeModal(); renderPage(); showToast(`${t.name} ${willActivate?'activated':'deactivated'}`); }});
      break;
    }
    case 'approve-trainer-confirm': {
      const t = TRAINERS.find(x=>x.id===id); if(!t) break;
      confirmModal({title:'Approve Trainer', body:`Are you sure you want to approve <b>${esc(t.name)}</b>? They will immediately gain access to the platform.`, confirmLabel:'Approve', confirmClass:'btn-primary',
        onConfirm:()=>{ t.status='approved'; t.appliedDate=t.appliedDate; closeModal(); renderPage(); showToast(`${t.name} approved — trainer access granted`); api.audit.log(`Approved trainer registration — ${t.name}`); api.notifications.push({type:'trainer', icon:'check', title:'Trainer approved', desc:`${t.name}'s registration was approved and now has platform access.`}); refreshDashboardLive(); }});
      break;
    }
    case 'reject-trainer-confirm': {
      const t = TRAINERS.find(x=>x.id===id); if(!t) break;
      openModal(`${modalHeader('Reject Trainer Registration', t.name)}
        <div class="modal-body">
          <p style="font-size:13.5px;color:var(--text-soft);">This trainer will not be able to log in. Please provide a reason for the rejection — it will be visible to the trainer.</p>
          <div class="field"><label>Reason <span class="req">*</span></label><textarea id="rejectReasonInput" rows="4" placeholder="e.g. Specialization does not match current department requirements…"></textarea></div>
        </div>
        <div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-reject-trainer" data-id="${t.id}">${ic('x','icon-sm')}Reject</button></div>`);
      break;
    }
    case 'confirm-reject-trainer': {
      const t = TRAINERS.find(x=>x.id===id); if(!t) break;
      const reason = document.getElementById('rejectReasonInput')?.value.trim();
      t.status='rejected'; t.rejectReason = reason || 'No reason provided.';
      closeModal(); renderPage(); showToast(`${t.name}'s registration was rejected`, 'error');
      api.audit.log(`Rejected trainer registration — ${t.name}`);
      api.notifications.push({type:'trainer', icon:'x', title:'Trainer rejected', desc:`${t.name}'s registration was rejected — ${t.rejectReason}`});
      refreshDashboardLive();
      break;
    }

    case 'generate-report': openReportPreview(id); break;
    case 'preview-report': openReportPreview(id); break;
    case 'export': {
      const what = el.dataset.what;
      showToast(`Generating ${what.replace(/-/g,' ')}…`,'info');
      setTimeout(()=>{
        try{
          handleExport(what);
          showToast('Download ready');
          if(!['sample-template'].includes(what)){
            api.audit.log(`Generated report — ${what.replace(/-/g,' ')}`);
            if(/-pdf$|-excel$/.test(what) && !['students-pdf','students-excel','results-pdf','results-excel'].includes(what)){
              api.notifications.push({ type:'report', icon:'fileText', title:'Report ready', desc:`${what.replace(/-(pdf|excel)$/,'').replace(/-/g,' ')} report has finished generating and is ready to download.` });
            }
            refreshDashboardLive();
          }
        }catch(err){ showToast('Export failed — please try again','error'); }
      }, 500);
      break;
    }
    case 'print-report': { const data = buildReportData(id); printTable(data.title, data.columns, data.rows); break; }
    case 'choose-file': triggerFilePicker(); break;
    case 'confirm-bulk-import': {
      const rows = PENDING_UPLOAD_ROWS;
      closeModal();
      showToast('Upload in progress…','info');
      api.students.bulkImport(rows).then(res=>{
        showToast(`${res.total} records processed — ${res.ok} succeeded, ${res.failed} flagged for review`);
        api.audit.log(`Uploaded ${res.ok} student records via bulk upload`);
        api.notifications.push({ type:'upload', icon:'upload', title:'New student upload', desc:`${res.ok} student records were bulk-uploaded.` });
        STATE.tab.students='list';
        refreshDashboardLive();
        renderPage();
      });
      PENDING_UPLOAD_ROWS = [];
      break;
    }

    case 'save-profile': showToast('Profile updated successfully'); break;
    case 'change-password': showToast('Password updated successfully'); break;
    case 'revoke-session': showToast('Session revoked'); break;

    case 'close-modal': closeModal(); break;
    case 'run-confirm': { const fn = window.__pendingConfirm; if(fn) fn(); break; }
  }
}, true); // capture phase: ensures clicks on buttons inside modals (which stopPropagation() on the wrapper to prevent overlay-close) are still caught.

document.addEventListener('input', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='filter-students'){
    STATE.filters.students[el.dataset.field] = el.value;
    STATE.page_num.students = 1;
    const active = document.activeElement;
    renderPage();
    const again = document.querySelector(`[data-action="filter-students"][data-field="${el.dataset.field}"]`);
    if(again && again.tagName==='INPUT'){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  }
  if(action==='filter-trainers'){
    STATE.filters.trainers[el.dataset.field] = el.value;
    const active = document.activeElement;
    renderPage();
    const again = document.querySelector(`[data-action="filter-trainers"][data-field="${el.dataset.field}"]`);
    if(again && again.tagName==='INPUT'){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  }
});
document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action="filter-students"]');
  if(el){ STATE.filters.students[el.dataset.field] = el.value; STATE.page_num.students = 1; renderPage(); }
  const el2 = e.target.closest('[data-action="filter-trainers"]');
  if(el2){ STATE.filters.trainers[el2.dataset.field] = el2.value; renderPage(); }
  if(e.target.id==='bulkFileInput' && e.target.files && e.target.files[0]){ handleBulkFile(e.target.files[0]); }
});
document.addEventListener('dragover', (e)=>{ if(e.target.closest('#bulkDropZone')) e.preventDefault(); });
document.addEventListener('drop', (e)=>{
  const zone = e.target.closest('#bulkDropZone');
  if(!zone) return;
  e.preventDefault();
  if(e.dataTransfer.files && e.dataTransfer.files[0]) handleBulkFile(e.dataTransfer.files[0]);
});

/* ============================================================
   INIT
============================================================ */
function init(){
  buildShell();
  goPage('dashboard');
}
init();
</script>
